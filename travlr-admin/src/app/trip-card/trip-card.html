<div class="card">

  <div class="card-body">

    <h2 class="card-title">{{ trip.name }}</h2>

    <p class="card-text">
      {{ trip.description }}
    </p>

    <p>
      <strong>Destination:</strong> {{ trip.destination }}
    </p>

    <p>
      <strong>Duration:</strong> {{ trip.duration }}
    </p>

    <p>
      <strong>Price:</strong> {{ trip.price }}
    </p>

  </div>

</div>
